<title>TIDPUNKT</title>

<style>

:root{
    --green:#087f5b;
    --green2:#0ca678;
    --green-light:#e4f4ee;
    --dark:#183027;
    --gray:#73827b;
    --bg:#f4f7f5;
    --white:#ffffff;
    --line:#e5ebe8;
    --red:#d64545;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:var(--bg);
    color:var(--dark);

button,
input,
select,

button{

/* ================= LOGIN ================= */

#loginScreen{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    background:
        linear-gradient(
            145deg,

}

.login-box{
    width:100%;
    max-width:420px;
    background:white;
    border-radius:28px;
    padding:30px;
    box-shadow:

}

.login-logo{
    text-align:center;
    font-size:28px;
    font-weight:bold;

    color:var(--green);
}

.login-subtitle{
    text-align:center;
    color:var(--gray);

}

.login-tabs{

.login-tab{

    padding:13px;

    background:#eef3f0;
    color:var(--gray);

}

.login-tab.active{

}

.login-field{

}

}

.login-button{

/* ================= APP ================= */

/* =====================================================

const projects = [

    ["P7 Änghalsvägen 2B","Plattsättarna"],

    ["P6 Hasselbacken 3","Plattsättarna"],

    ["P5 Skolvägen 3, Torsvik","Mp Projekt AB"],

    ["P4 Mariatorget 6a","Lukas Kvisberg"],

    ["P3 Torgstärket","Einar Mattsson"],

    ["P2 Runiusgatan 9","Plattsättarna"],

    ["P1 Skogsslingan 11","Plattsättarna"]

];


/* =====================================================
   USERS
===================================================== */

const users = [

    {
        id:"admin-001",
        name:"System Admin",
        email:"admin@tidpunkt.se",
        password:"admin123",
        role:"system_admin",
        companyId:null
    },

    {
        id:"owner-001",
        name:"Elson",
        email:"elson@foretag.se",
        password:"1234",
        role:"owner",
        companyId:"company-001"
    },

    {
        id:"employee-001",
        name:"Anna Andersson",
        email:"anna@foretag.se",
        password:"1234",
        role:"employee",
        companyId:"company-001"
    }

];


/* =====================================================
   COMPANIES
===================================================== */

const companies = [

    {
        id:"company-001",
        name:"Företag A",
        orgnr:"969800-7862",
        plan:"Premium",
        status:"active"
    }

];


/* =====================================================
   STATE
===================================================== */

let currentUser = null;

let loginType = "company";

let entries =
    JSON.parse(
        localStorage.getItem(
            "tidpunkt_entries"
        ) || "[]"
    );

let reportMode = "day";

let reportDate = new Date();

let planningMode = "month";


/* =====================================================
   HELPERS
===================================================== */

function pad(n){

    return String(n)
        .padStart(2,"0");

}


function dateISO(date){

    return (
        date.getFullYear()
        + "-"
        + pad(date.getMonth()+1)
        + "-"
        + pad(date.getDate())
    );

}


function formatMinutes(minutes){

    const h =
        Math.floor(minutes / 60);

    const m =
        Math.round(minutes % 60);

    return (
        pad(h)
        + ":"
        + pad(m)
    );

}


function totalDay(date){

    return entries

        .filter(
            e =>
                e.date === date
                &&
                e.companyId ===
                    currentUser?.companyId
        )

        .reduce(
            (sum,e) =>
                sum + e.minutes,
            0
        );

}


function getMonday(date){

    const d =
        new Date(date);

    const day =
        d.getDay();

    d.setDate(
        d.getDate()
        -
        (
            day === 0
            ? 6
            : day - 1
        )
    );

    d.setHours(
        0,0,0,0
    );

    return d;

}


function totalWeek(date){

    const monday =
        getMonday(date);

    let total = 0;

    for(
        let i=0;
        i<7;
        i++
    ){

        const d =
            new Date(monday);

        d.setDate(
            monday.getDate()+i
        );

        total +=
            totalDay(
                dateISO(d)
            );

    }

    return total;

}


function totalMonth(date){

    return entries

        .filter(e => {

            const d =
                new Date(
                    e.date +
                    "T00:00:00"
                );

            return (

                d.getFullYear()
                ===
                date.getFullYear()

                &&

                d.getMonth()
                ===
                date.getMonth()

                &&

                e.companyId
                ===
                currentUser?.companyId

            );

        })

        .reduce(
            (sum,e) =>
                sum + e.minutes,
            0
        );

}


/* =====================================================
   LOGIN TYPE
===================================================== */

function setLoginType(type){

    loginType = type;

    document
        .getElementById("companyTab")
        .classList.toggle(
            "active",
            type === "company"
        );

/* =====================================================
   LOGIN
===================================================== */

function login(){

    const email =
        document
            .getElementById(
                "loginEmail"
            )
            .value
            .trim()
            .toLowerCase();

    const password =
        document
            .getElementById(
                "loginPassword"
            )
            .value;

    const user =
        users.find(
            u =>
                u.email.toLowerCase()
                === email
                &&
                u.password === password
        );


    if(!user){

        alert(
            "Fel e-post eller lösenord."
        );

        return;

    }


    if(
        loginType === "company"
        &&
        user.role === "system_admin"
    ){

        alert(
            "System Admin ska logga in via Företag."
        );

    }


    currentUser = user;

    localStorage.setItem(
        "tidpunkt_current_user",
        user.id
    );

    document
        .getElementById(
            "loginScreen"
        )
        .style.display =
            "none";

    document
        .getElementById(
            "app"
        )
        .style.display =
            "block";


    initializeApp();

}

/* =====================================================
   DAY
===================================================== */

function renderDay(){

    const date =
        dateISO(reportDate);


    const list =
        entries.filter(
            e =>
                e.date === date
                &&
                e.companyId
                ===
                currentUser.companyId
                &&
                e.userId
                ===
                currentUser.id
        );


    let html = `

        <div class="period">

            <button
                class="arrow"
                onclick="moveDay(-1)"
            >
                ‹
            </button>

            <div class="period-title">

                ${reportDate.toLocaleDateString(
                    "sv-SE",
                    {
                        weekday:"long",
                        day:"numeric",
                        month:"long"
                    }
                )}

            </div>

            <button
                class="arrow"
                onclick="moveDay(1)"
            >
                ›
            </button>

        </div>

    `;


    if(list.length === 0){

        html += `

            <div class="empty">
                Ingen rapporterad tid
            </div>

        `;

    }


    list.forEach(
        entry => {

            html += `

                <div class="time-entry">

                    <div class="entry-top">

                        <span class="project-name">
                            ${entry.project}
                        </span>

                        <span class="entry-hours">
                            ${formatMinutes(
                                entry.minutes
                            )}
                        </span>

                    </div>

                    <div class="entry-info">

                        ${entry.activity}
                        ·
                        ${entry.start}
                        –
                        ${entry.end}

                    </div>

                    <div class="entry-info">

                        Paus:
                        ${entry.pause}
                        min

                    </div>

                </div>

            `;

        }
    );


    html += `

        <div class="total-row">

            <span>
                SUMMA DAG
            </span>

            <span>
                ${formatMinutes(
                    totalDay(date)
                )}
            </span>

        </div>

    `;


    document
        .getElementById(
            "dayReport"
        )
        .innerHTML =
            html;

}


function moveDay(amount){

    reportDate.setDate(
        reportDate.getDate()
        + amount
    );

    renderReport();

}


/* =====================================================
   WEEK
===================================================== */

function renderWeek(){

    const monday =
        getMonday(reportDate);


    const names = [
        "Mån",
        "Tis",
        "Ons",
        "Tor",
        "Fre",
        "Lör",
        "Sön"
    ];


    let html = `

        <div class="period">

            <button
                class="arrow"
                onclick="moveWeek(-1)"
            >
                ‹
            </button>

            <div class="period-title">
                Vecka
            </div>

            <button
                class="arrow"
                onclick="moveWeek(1)"
            >
                ›
            </button>

        </div>

    `;


    for(
        let i=0;
        i<7;
        i++
    ){

        const d =
            new Date(monday);

        d.setDate(
            monday.getDate()+i
        );


        const total =
            totalDay(
                dateISO(d)
            );


        const width =
            Math.min(
                100,
                total / 480 * 100
            );


        html += `

            <div
                style="
                    display:grid;
                    grid-template-columns:60px 1fr 55px;
                    gap:8px;
                    align-items:center;
                    margin-bottom:12px;
                "
            >

                <div
                    style="
                        font-size:12px;
                        font-weight:bold;
                    "
                >
                    ${names[i]}
                    ${d.getDate()}/
                    ${d.getMonth()+1}
                </div>

                <div
                    style="
                        height:8px;
                        background:#edf1ef;
                        border-radius:10px;
                        overflow:hidden;
                    "
                >

                    <span
                        style="
                            display:block;
                            height:100%;
                            width:${width}%;
                            background:#0ca678;
                        "
                    ></span>

                </div>

                <div
                    style="
                        font-size:12px;
                        color:#087f5b;
                        font-weight:bold;
                    "
                >
                    ${formatMinutes(total)}
                </div>

            </div>

        `;

    }


    html += `

        <div class="total-row">

            <span>
                SUMMA VECKA
            </span>

            <span>
                ${formatMinutes(
                    totalWeek(
                        reportDate
                    )
                )}
            </span>

        </div>

    `;


    document
        .getElementById(
            "weekReport"
        )
        .innerHTML =
            html;

}


function moveWeek(amount){

    reportDate.setDate(
        reportDate.getDate()
        + amount * 7
    );

    renderReport();

}


/* =====================================================
   MONTH
===================================================== */

function renderMonth(){

    const year =
        reportDate.getFullYear();

    const month =
        reportDate.getMonth();


    const first =
        new Date(
            year,
            month,
            1
        );


    const days =
        new Date(
            year,
            month+1,
            0
        ).getDate();


    let html = `

        <div class="period">

            <button
                class="arrow"
                onclick="moveMonth(-1)"
            >
                ‹
            </button>

            <div class="period-title">

                ${reportDate.toLocaleDateString(
                    "sv-SE",
                    {
                        month:"long",
                        year:"numeric"
                    }
                )}

            </div>

            <button
                class="arrow"
                onclick="moveMonth(1)"
            >
                ›
            </button>

        </div>

    `;


    for(
        let day=1;
        day<=days;
        day++
    ){

        const d =
            new Date(
                year,
                month,
                day
            );


        const total =
            totalDay(
                dateISO(d)
            );


        html += `

            <div
                class="time-entry"
                style="
                    display:flex;
                    justify-content:space-between;
                "
            >

                <span>
                    ${day}
                </span>

                <strong
                    style="
                        color:#087f5b;
                    "
                >
                    ${
                        total > 0
                        ?
                        formatMinutes(total)
                        :
                        "–"
                    }
                </strong>

            </div>

        `;

    }


    html += `

        <div class="total-row">

            <span>
                SUMMA MÅNAD
            </span>

            <span>
                ${formatMinutes(
                    totalMonth(
                        reportDate
                    )
                )}
            </span>

        </div>

    `;


    document
        .getElementById(
            "monthReport"
        )
        .innerHTML =
            html;

}


function moveMonth(amount){

    reportDate.setMonth(
        reportDate.getMonth()
        + amount
    );

    renderReport();

}

            project => {

                const total =

                        .filter(

                                e.userId

                html += `

/* =====================================================
   SAVE TIME
===================================================== */

function saveEntry(){

    const project =
        document
            .getElementById(
                "entryProject"
            )
            .value;


    const activity =
        document
            .getElementById(
                "entryActivity"
            )
            .value;


    const date =
        document
            .getElementById(
                "entryDate"
            )
            .value;


    const start =
        document
            .getElementById(
                "entryStart"
            )
            .value;


    const end =
        document
            .getElementById(
                "entryEnd"
            )
            .value;


    const pause =
        Number(
            document
                .getElementById(
                    "entryPause"
                )
                .value
            || 0
        );


    if(
        !date ||
        !start ||
        !end
    ){

        alert(
            "Fyll i datum, start och slut."
        );

        return;

    }


    const startDate =
        new Date(
            `${date}T${start}`
        );


    const endDate =
        new Date(
            `${date}T${end}`
        );


    let minutes =
        (
            endDate -
            startDate
        ) / 60000;


    minutes -= pause;


    if(minutes <= 0){

        alert(
            "Tiden är inte korrekt."
        );

        return;

    }


    /*
       VIKTIGT:

       Varje tidsregistrering får
       både companyId och userId.
    */

    entries.push({

        id:
            Date.now(),

        companyId:
            currentUser.companyId,

        userId:
            currentUser.id,

        project,

        activity,

        date,

        start,

        end,

        pause,

        minutes,

        note:
            document
                .getElementById(
                    "entryNote"
                )
                .value

    });


    localStorage.setItem(
        "tidpunkt_entries",
        JSON.stringify(
            entries
        )
    );


    closeAddTime();


    renderHome();

    renderReport();

    renderProjects();

}

    document

        )
        .style.display =
            "none";


    document
        .getElementById(
            "app"
        )
        .style.display =
            "block";


    initializeApp();

}
