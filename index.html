<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TIDPUNKT</title>

<style>

:root{
    --green:#087f5b;
    --green-light:#e4f4ee;
    --dark:#183027;
    --gray:#73827b;
    --bg:#f4f7f5;
    --white:#ffffff;
    --line:#e5ebe8;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:var(--bg);
    color:var(--dark);
}

button,
input,
select,
textarea{
    font:inherit;
}

button{
    cursor:pointer;
}

.app{
    max-width:520px;
    min-height:100vh;
    margin:auto;
    padding-bottom:85px;
}

/* HEADER */

.header{
    background:linear-gradient(
        145deg,
        #075c45,
        #0ca678
    );

    color:white;

    padding:20px;

    border-radius:
        0 0 28px 28px;
}

.header-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:21px;
    font-weight:bold;
    letter-spacing:2px;
}

.avatar{
    width:40px;
    height:40px;
    border:0;
    border-radius:50%;
    background:rgba(255,255,255,.18);
    color:white;
}

.header-title{
    margin-top:25px;
}

.header-title small{
    opacity:.8;
}

.header-title h1{
    margin-top:5px;
    font-size:26px;
}

/* CONTENT */

.content{
    padding:16px;
}

.page{
    display:none;
}

.page.active{
    display:block;
}

.card{
    background:white;
    border-radius:20px;
    padding:18px;
    margin-bottom:15px;
    box-shadow:
        0 8px 28px
        rgba(25,55,45,.08);
}

.card-title{
    font-size:19px;
    font-weight:bold;
    margin-bottom:15px;
}

/* HOME */

.hero{
    background:
        linear-gradient(
            145deg,
            #087f5b,
            #0ca678
        );

    color:white;
}

.total{
    font-size:48px;
    font-weight:bold;
    margin:8px 0;
}

.quick{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:18px;
}

.quick button{
    border:0;
    border-radius:13px;
    padding:13px;
    background:white;
    color:var(--green);
    font-weight:bold;
}

/* STATS */

.stats{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.stat{
    background:white;
    border-radius:16px;
    padding:16px;
    box-shadow:
        0 8px 25px
        rgba(25,55,45,.07);
}

.stat strong{
    display:block;
    margin-top:8px;
    font-size:24px;
    color:var(--green);
}

/* REPORT TABS */

.report-tabs{
    display:grid;
    grid-template-columns:
        repeat(3,1fr);

    gap:5px;

    background:#e8efec;

    padding:5px;

    border-radius:14px;

    margin-bottom:18px;
}

.report-tabs button{
    border:0;
    background:transparent;
    color:#587068;
    border-radius:10px;
    padding:12px 5px;
    font-weight:bold;
}

.report-tabs button.active{
    background:white;
    color:var(--green);

    box-shadow:
        0 2px 8px
        rgba(0,0,0,.08);
}

/* PERIOD */

.period{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:15px;
}

.arrow{
    width:38px;
    height:38px;
    border:0;
    border-radius:12px;
    background:var(--green-light);
    color:var(--green);
    font-size:22px;
}

.period-title{
    text-align:center;
    font-weight:bold;
}

/* DAY */

.time-entry{
    border:1px solid var(--line);
    border-radius:16px;
    padding:14px;
    margin-top:10px;
}

.entry-top{
    display:flex;
    justify-content:space-between;
    gap:10px;
}

.project-name{
    font-weight:bold;
}

.entry-hours{
    color:var(--green);
    font-weight:bold;
}

.entry-info{
    color:var(--gray);
    font-size:13px;
    margin-top:5px;
}

.total-row{
    display:flex;
    justify-content:space-between;

    border-top:
        1px solid var(--line);

    margin-top:15px;
    padding-top:15px;

    font-weight:bold;
}

/* WEEK */

.week-row{
    display:grid;

    grid-template-columns:
        55px 1fr 60px;

    align-items:center;

    gap:10px;

    padding:13px 0;

    border-bottom:
        1px solid var(--line);
}

.week-day{
    font-weight:bold;
}

.bar{
    height:10px;
    background:#edf2ef;
    border-radius:20px;
    overflow:hidden;
}

.bar span{
    display:block;
    height:100%;

    background:
        linear-gradient(
            90deg,
            #087f5b,
            #20c997
        );

    border-radius:20px;
}

.week-hours{
    text-align:right;
    color:var(--green);
    font-weight:bold;
}

/* MONTH */

.calendar{
    display:grid;
    grid-template-columns:
        repeat(7,1fr);

    border-top:
        1px solid var(--line);

    border-left:
        1px solid var(--line);
}

.calendar-head{
    text-align:center;
    padding:8px 0;
    font-size:10px;
    color:var(--gray);
    font-weight:bold;
}

.calendar-day{
    min-height:65px;

    padding:6px;

    border-right:
        1px solid var(--line);

    border-bottom:
        1px solid var(--line);

    background:white;
}

.calendar-number{
    font-weight:bold;
    font-size:12px;
}

.calendar-hours{
    display:inline-block;

    margin-top:8px;

    background:var(--green-light);

    color:var(--green);

    padding:4px 6px;

    border-radius:8px;

    font-size:10px;

    font-weight:bold;
}

.today{
    outline:
        2px solid
        var(--green);

    outline-offset:-2px;
}

/* PROJECTS */

.search{
    width:100%;

    padding:13px;

    border:
        1px solid
        var(--line);

    border-radius:13px;

    margin-bottom:10px;

    outline:none;
}

.project{
    display:flex;
    justify-content:space-between;

    padding:14px 0;

    border-bottom:
        1px solid
        var(--line);
}

.project-client{
    color:var(--gray);
    font-size:12px;
    margin-top:4px;
}

.project-total{
    color:var(--green);
    font-weight:bold;
}

/* FAB */

.fab{
    position:fixed;

    right:
        max(
            20px,
            calc(
                (100vw - 520px)/2
                + 20px
            )
        );

    bottom:98px;

    width:56px;
    height:56px;

    border:0;

    border-radius:50%;

    background:#0ca678;

    color:white;

    font-size:30px;

    box-shadow:
        0 8px 22px
        rgba(8,127,91,.3);
}

/* NAVIGATION */

.bottom-nav{
    position:fixed;

    bottom:0;
    left:50%;

    transform:
        translateX(-50%);

    width:100%;
    max-width:520px;

    height:80px;

    background:white;

    border-top:
        1px solid
        var(--line);

    display:grid;

    grid-template-columns:
        repeat(5,1fr);
}

.nav-button{
    border:0;

    background:white;

    color:#87958f;

    font-size:10px;

    font-weight:bold;
}

.nav-button span{
    display:block;

    font-size:22px;

    margin-bottom:4px;
}

.nav-button.active{
    color:var(--green);
}

/* FORM */

.form-row{
    padding:13px 0;

    border-bottom:
        1px solid
        var(--line);
}

.form-row label{
    display:block;

    font-size:12px;

    color:var(--gray);

    margin-bottom:6px;
}

.form-row input,
.form-row select,
.form-row textarea{
    width:100%;

    border:0;

    outline:none;

    background:transparent;
}

.save{
    width:100%;

    border:0;

    border-radius:14px;

    padding:15px;

    margin-top:18px;

    background:var(--green);

    color:white;

    font-weight:bold;
}

.empty{
    text-align:center;

    color:var(--gray);

    padding:40px 10px;
}

</style>
</head>


<body>

<div class="app">


<!-- HEADER -->

<header class="header">

    <div class="header-top">

        <div class="logo">
            TIDPUNKT
        </div>

        <button class="avatar"
                onclick="openPage('profile')">
            EL
        </button>

    </div>


    <div class="header-title">

        <small>
            Välkommen tillbaka
        </small>

        <h1>
            Min arbetsdag
        </h1>

    </div>

</header>


<main class="content">


<!-- ================= HOME ================= -->

<section
    id="home"
    class="page active"
>

    <div class="card hero">

        <small>
            RAPPORTERAT IDAG
        </small>

        <div
            id="homeTotal"
            class="total"
        >
            00:00
        </div>

        <small>
            timmar
        </small>


        <div class="quick">

            <button
                onclick="openAddTime()"

                ＋ Lägg till tid
            </button>

            <button
                onclick="openPage('report')"

                Rapport →

        </div>

    </div>


    <div class="stats">

        <div class="stat">

            <span>
                Denna vecka
            </span>

            <strong
                id="homeWeek"
            >
                00:00
            </strong>

        </div>


        <div class="stat">

            <span>
                Denna månad
            </span>

            <strong
                id="homeMonth"
            >
                00:00
            </strong>

        </div>

    </div>

</section>


<!-- ================= RAPPORT ================= -->

<section
    id="report"
    class="page"
>

    <div class="card">

        <div class="card-title">
            ANMÄLAN / RAPPORTERING
        </div>


        <!-- ΜΙΑ ΚΑΡΤΕΛΑ -->
        <div class="report-tabs">

            <button
                id="tabDay"
                onclick="setReportMode('day')"
            >
                Dag

            <button
                id="tabWeek"
                onclick="setReportMode('week')"
            >

            <button

                onclick="setReportMode('month')"

                Månad

        </div>


        <div id="dayReport"></div>

        <div

        ></div>

        <div

            style="display:none"
        ></div>

    </div>

</section>


<!-- ================= PROJECT ================= -->

<section
    id="projects"
    class="page"
>

    <div class="card">

        <div class="card-title">
            Projekt
        </div>


        <input

</section>


<!-- ================= PLANERING ================= -->

<section

>

        <div class="report-tabs">

            <button

                Dag

            <button
                id="planWeek"

            >
                Vecka
            </button>

            <button
                id="planMonth"
                onclick="setPlanningMode('month')"
            >
                Månad
            </button>

        </div>


        <div
            id="planningContent"

    </div>

</section>


<!-- ================= PROFILE ================= -->

<section
    id="profile"
    class="page"
>

    <div class="card">

        <div class="card-title">
            Min profil
        </div>


        <div class="time-entry">

            <div class="entry-top">

                <span class="project-name">
                    Elson
                </span>

                <span class="entry-hours">
                    Personal
                </span>

            </div>

            <div class="entry-info">
                TIDPUNKT
            </div>

        </div>


        <div class="time-entry">

            <div class="entry-top">

                <span class="project-name">
                    Status
                </span>

                <span class="entry-hours">
                    Aktiv
                </span>

            </div>

        </div>

    </div>

</section>


</main>


<!-- + -->

<button
    class="fab"
    onclick="openAddTime()"
>
    +
</button>


<!-- NAVIGATION -->

<nav class="bottom-nav">

    <button
        class="nav-button active"

        onclick="openPage('home')"

        <span>⌂</span>
        Hem

    <button

    </button>


    <button

    <button

<!-- ================= ADD TIME ================= -->

<div
    id="addModal"
    style="
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    z-index:100;
    align-items:flex-end;
    "
>

    <div
        style="
        background:white;
        width:100%;
        max-width:520px;
        margin:auto;
        border-radius:24px 24px 0 0;

    >

        <div
            style="
            display:flex;

            <h2>
                Lägg till tid

                id="entryActivity"
            >

                <option>
                    Städning
                </option>

                <option>
                    Hemstädning
                </option>

                <option>
                    Kontorsstädning
                </option>

                <option>
                    Flyttstädning
                </option>

                <option>
                    Övrigt
                </option>

            </select>

        </div>


        <div class="form-row">

            <label>
                Datum
            </label>

            <input
                id="entryDate"
                type="date"
            >

        </div>


        <div class="form-row">

            <label>
                Start
            </label>

            <input
                id="entryStart"
                type="time"
            >

        </div>


        <div class="form-row">

            <label>
                Slut
            </label>

            <input
                id="entryEnd"
                type="time"
            >

        </div>


        <div class="form-row">

            <label>
                Paus i minuter
            </label>

            <input
                id="entryPause"
                type="number"
                min="0"
                value="0"
            >

        </div>


        <div class="form-row">

            <label>
                Anteckning
            </label>

            <textarea
                id="entryNote"
                rows="3"
            ></textarea>

        </div>


        <button
            class="save"
            onclick="saveEntry()"
        >
            Spara tid
        </button>

    </div>

</div>


<script>

/* ================= DATA ================= */

const projects = [

    ["P8 Gullmarsvägen 50","Rivning"],

    ["P7 Änghalsvägen 2B","Plattsättarna"],

    ["P6 Hasselbacken 3","Plattsättarna"],

    ["P5 Skolvägen 3, Torsvik","Mp Projekt AB"],

    ["P4 Mariatorget 6a","Lukas Kvisberg"],

    ["P3 Torgstärket","Einar Mattsson"],

    ["P2 Runiusgatan 9","Plattsättarna"],

    ["P1 Skogsslingan 11","Plattsättarna"]

];


let entries =
    JSON.parse(
        localStorage.getItem(
            "tidpunkt_entries"
        ) || "[]"
    );


let reportMode =
    "day";


let reportDate =
    new Date();


let planningMode =
    "month";


let planningDate =
    new Date();


/* ================= HELPERS ================= */

function pad(n){

    return String(n)
        .padStart(2,"0");

}


function dateISO(date){

    return (

        date.getFullYear()
        + "-"
        + pad(
            date.getMonth()+1
        )
        + "-"
        + pad(
            date.getDate()
        )

    );

}


function formatMinutes(minutes){

    const h =
        Math.floor(
            minutes / 60
        );

    const m =
        Math.round(
            minutes % 60
        );

    return (
        pad(h)
        + ":"
        + pad(m)
    );

}


function totalDay(date){

    return entries
        .filter(
            e =>
                e.date === date
        )
        .reduce(
            (sum,e) =>
                sum + e.minutes,
            0
        );

}


function getMonday(date){

    const d =
        new Date(date);

    const day =
        d.getDay();

    d.setDate(
        d.getDate()
        -
        (
            day === 0
            ? 6
            : day - 1
        )
    );

    d.setHours(
        0,0,0,0
    );

    return d;

}


function totalWeek(date){

    const monday =
        getMonday(date);

    let total = 0;

    for(
        let i = 0;
        i < 7;
        i++
    ){

        const d =
            new Date(monday);

        d.setDate(
            monday.getDate()
            + i
        );

        total +=
            totalDay(
                dateISO(d)
            );

    }

    return total;

}


function totalMonth(date){

    return entries
        .filter(e => {

            const d =
                new Date(
                    e.date
                    + "T00:00:00"
                );

            return (

                d.getFullYear()
                === date.getFullYear()

                &&

                d.getMonth()
                === date.getMonth()

            );

        })
        .reduce(
            (sum,e) =>
                sum + e.minutes,
            0
        );

}


/* ================= NAVIGATION ================= */

function openPage(page){

    document
        .querySelectorAll(
            ".page"
        )
        .forEach(
            p =>
                p.classList.remove(
                    "active"
                )
        );


    document
        .getElementById(page)
        .classList.add(
            "active"
        );


    document
        .querySelectorAll(
            ".nav-button"
        )
        .forEach(
            button => {

                button.classList.toggle(
                    "active",
                    button.dataset.page
                    === page
                );

            }
        );


    if(
        page === "home"
    ){

        renderHome();

    }


    if(
        page === "report"
    ){

        renderReport();

    }


    if(
        page === "projects"
    ){

        renderProjects();

    }


    if(
        page === "planning"
    ){

        renderPlanning();

    }

}


/* ================= REPORT ================= */

function setReportMode(mode){

    reportMode =
        mode;

    renderReport();

}


function renderReport(){

    document
        .getElementById(
            "tabDay"
        )
        .classList.toggle(
            "active",
            reportMode === "day"
        );


    document
        .getElementById(
            "tabWeek"
        )
        .classList.toggle(
            "active",
            reportMode === "week"
        );


    document
        .getElementById(
            "tabMonth"
        )
        .classList.toggle(
            "active",
            reportMode === "month"
        );


    document
        .getElementById(
            "dayReport"
        )
        .style.display =
            reportMode === "day"
            ? "block"
            : "none";


    document
        .getElementById(
            "weekReport"
        )
        .style.display =
            reportMode === "week"
            ? "block"
            : "none";


    document
        .getElementById(
            "monthReport"
        )
        .style.display =
            reportMode === "month"
            ? "block"
            : "none";


    if(
        reportMode === "day"
    ){

        renderDay();

    }


    if(
        reportMode === "week"
    ){

        renderWeek();

    }


    if(
        reportMode === "month"
    ){

        renderMonth();

    }

}


/* ================= DAY ================= */

function renderDay(){

    const date =
        dateISO(
            reportDate
        );


    const list =
        entries.filter(
            e =>
                e.date === date
        );


    let html = `

        <div class="period">

            <button
                class="arrow"
                onclick="moveDay(-1)"
            >
                ‹
            </button>

            <div class="period-title">

                ${reportDate.toLocaleDateString(
                    "sv-SE",
                    {
                        weekday:"long",
                        day:"numeric",
                        month:"long"
                    }
                )}

            </div>

            <button
                class="arrow"
                onclick="moveDay(1)"
            >
                ›
            </button>

        </div>

    `;


    if(
        list.length === 0
    ){

        html += `

            <div class="empty">

                Ingen rapporterad tid

            </div>

        `;

    }


    list.forEach(
        entry => {

            html += `

                <div
                    class="time-entry"
                >

                    <div
                        class="entry-top"
                    >

                        <span
                            class="project-name"
                        >
                            ${entry.project}
                        </span>

                        <span
                            class="entry-hours"
                        >
                            ${formatMinutes(
                                entry.minutes
                            )}
                        </span>

                    </div>


                    <div
                        class="entry-info"
                    >

                        ${entry.activity}

                        ·

                        ${entry.start}
                        –
                        ${entry.end}

                    </div>


                    <div
                        class="entry-info"
                    >

                        Paus:
                        ${entry.pause}
                        min

                    </div>

                </div>

            `;

        }
    );


    html += `

        <div class="total-row">

            <span>
                SUMMA DAG
            </span>

            <span>
                ${formatMinutes(
                    totalDay(date)
                )}
            </span>

        </div>

    `;


    document
        .getElementById(
            "dayReport"
        )
        .innerHTML =
            html;

}


function moveDay(amount){

    reportDate.setDate(
        reportDate.getDate()
        + amount
    );

    renderReport();

}


/* ================= WEEK ================= */

function renderWeek(){

    const monday =
        getMonday(
            reportDate
        );


    const names = [
        "Mån",
        "Tis",
        "Ons",
        "Tor",
        "Fre",
        "Lör",
        "Sön"
    ];


    let html = `

        <div class="period">

            <button
                class="arrow"
                onclick="moveWeek(-1)"
            >
                ‹
            </button>

            <div class="period-title">
                Vecka
            </div>

            <button
                class="arrow"
                onclick="moveWeek(1)"
            >
                ›
            </button>

        </div>

    `;


    for(
        let i = 0;
        i < 7;
        i++
    ){

        const d =
            new Date(monday);

        d.setDate(
            monday.getDate()
            + i
        );


        const total =
            totalDay(
                dateISO(d)
            );


        const width =
            Math.min(
                100,
                total / 480 * 100
            );


        html += `

            <div
                class="week-row"
            >

                <div
                    class="week-day"
                >
                    ${names[i]}
                    ${d.getDate()}/
                    ${d.getMonth()+1}
                </div>


                <div
                    class="bar"
                >

                    <span
                        style="
                        width:${width}%
                        "
                    ></span>

                </div>


                <div
                    class="week-hours"
                >

                    ${formatMinutes(
                        total
                    )}

                </div>

            </div>

        `;

    }


    html += `

        <div class="total-row">

            <span>
                SUMMA VECKA
            </span>

            <span>
                ${formatMinutes(
                    totalWeek(
                        reportDate
                    )
                )}
            </span>

        </div>

    `;


    document
        .getElementById(
            "weekReport"
        )
        .innerHTML =
            html;

}


function moveWeek(amount){

    reportDate.setDate(
        reportDate.getDate()
        + amount * 7
    );

    renderReport();

}


/* ================= MONTH ================= */

function renderMonth(){

    const year =
        reportDate.getFullYear();

    const month =
        reportDate.getMonth();


    const first =
        new Date(
            year,
            month,
            1
        );


    const days =
        new Date(
            year,
            month + 1,
            0
        ).getDate();


    let start =
        first.getDay();


    start =
        start === 0
        ? 6
        : start - 1;


    let html = `

        <div class="period">

            <button
                class="arrow"
                onclick="moveMonth(-1)"
            >
                ‹
            </button>

            <div class="period-title">

                ${reportDate.toLocaleDateString(
                    "sv-SE",
                    {
                        month:"long",
                        year:"numeric"
                    }
                )}

            </div>

            <button
                class="arrow"
                onclick="moveMonth(1)"
            >
                ›
            </button>

        </div>


        <div class="calendar">

    `;


    [
        "M",
        "T",
        "O",
        "T",
        "F",
        "L",
        "S"
    ].forEach(
        day => {

            html += `

                <div
                    class="calendar-head"
                >
                    ${day}
                </div>

            `;

        }
    );


    for(
        let i = 0;
        i < start;
        i++
    ){

        html += `
            <div></div>
        `;

    }


    for(
        let day = 1;
        day <= days;
        day++
    ){

        const d =
            new Date(
                year,
                month,
                day
            );


        const date =
            dateISO(d);


        const total =
            totalDay(date);


        const today =
            date ===
            dateISO(
                new Date()
            );


        html += `

            <div
                class="
                    calendar-day
                    ${today ? "today" : ""}
                "
            >

                <div
                    class="calendar-number"
                >
                    ${day}
                </div>


                ${
                    total > 0
                    ?

                    `
                    <span
                        class="calendar-hours"
                    >
                        ${formatMinutes(
                            total
                        )}
                    </span>
                    `

                    :

                    ""
                }

            </div>

        `;

    }


    html += `
        </div>
    `;


    html += `

        <div class="total-row">

            <span>
                SUMMA MÅNAD
            </span>

            <span>
                ${formatMinutes(
                    totalMonth(
                        reportDate
                    )
                )}
            </span>

        </div>

    `;


    document
        .getElementById(
            "monthReport"
        )
        .innerHTML =
            html;

}


function moveMonth(amount){

    reportDate.setMonth(
        reportDate.getMonth()
        + amount
    );

    renderReport();

}


/* ================= HOME ================= */

function renderHome(){

    const today =
        new Date();


    document
        .getElementById(
            "homeTotal"
        )
        .textContent =
            formatMinutes(
                totalDay(
                    dateISO(today)
                )
            );


    document
        .getElementById(
            "homeWeek"
        )
        .textContent =
            formatMinutes(
                totalWeek(today)
            );


    document
        .getElementById(
            "homeMonth"
        )
        .textContent =
            formatMinutes(
                totalMonth(today)
            );

}


/* ================= PROJECTS ================= */

function renderProjects(){

    const search =
        document
            .getElementById(
                "projectSearch"
            )
            .value
            .toLowerCase();


    let html = "";


    projects
        .filter(
            project =>
                project[0]
                    .toLowerCase()
                    .includes(search)
                ||
                project[1]
                    .toLowerCase()
                    .includes(search)
        )
        .forEach(
            project => {

                const total =
                    entries
                        .filter(
                            e =>
                                e.project
                                === project[0]
                        )
                        .reduce(
                            (sum,e) =>
                                sum + e.minutes,
                            0
                        );


                html += `

                    <div
                        class="project"
                    >

                        <div>

                            <div
                                class="project-name"
                            >
                                ${project[0]}
                            </div>

                            <div
                                class="entry-info"
                            >
                                ${project[1]}
                            </div>

                        </div>


                        <div
                            class="project-total"
                        >
                            ${formatMinutes(
                                total
                            )}
                        </div>

                    </div>

                `;

            }
        );


    document
        .getElementById(
            "projectList"
        )
        .innerHTML =
            html;

}


/* ================= PLANNING ================= */

function setPlanningMode(mode){

    planningMode =
        mode;

    renderPlanning();

}


function renderPlanning(){

    document
        .getElementById(
            "planDay"
        )
        .classList.toggle(
            "active",
            planningMode === "day"
        );


    document
        .getElementById(
            "planWeek"
        )
        .classList.toggle(
            "active",
            planningMode === "week"
        );


    document
        .getElementById(
            "planMonth"
        )
        .classList.toggle(
            "active",
            planningMode === "month"
        );


    document
        .getElementById(
            "planningContent"
        )
        .innerHTML = `

            <div class="empty">

                Planering:
                ${planningMode}

            </div>

        `;

}


/* ================= ADD TIME ================= */

function openAddTime(){

    const modal =
        document
            .getElementById(
                "addModal"
            );


    modal.style.display =
        "flex";


    document
        .getElementById(
            "entryDate"
        )
        .value =
            dateISO(
                new Date()
            );


    document
        .getElementById(
            "entryProject"
        )
        .innerHTML =
            projects
                .map(
                    p =>
                        `
                        <option>
                            ${p[0]}
                        </option>
                        `
                )
                .join("");

}


function closeAddTime(){

    document
        .getElementById(
            "addModal"
        )
        .style.display =
            "none";

}


function saveEntry(){

    const project =
        document
            .getElementById(
                "entryProject"
            )
            .value;


    const activity =
        document
            .getElementById(
                "entryActivity"
            )
            .value;


    const date =
        document
            .getElementById(
                "entryDate"
            )
            .value;


    const start =
        document
            .getElementById(
                "entryStart"
            )
            .value;


    const end =
        document
            .getElementById(
                "entryEnd"
            )
            .value;


    const pause =
        Number(
            document
                .getElementById(
                    "entryPause"
                )
                .value
            || 0
        );


    if(
        !date
        ||
        !start
        ||
        !end
    ){

        alert(
            "Συμπλήρωσε ημερομηνία, αρχή και τέλος."
        );

        return;

    }


    const startDate =
        new Date(
            `${date}T${start}`
        );


    const endDate =
        new Date(
            `${date}T${end}`
        );


    let minutes =
        (
            endDate
            -
            startDate
        ) / 60000;


    minutes -= pause;


    if(
        minutes <= 0
    ){

        alert(
            "Η ώρα δεν είναι σωστή."
        );

        return;

    }


    entries.push({

        id:
            Date.now(),

        project,

        activity,

        date,

        start,

        end,

        pause,

        minutes,

        note:
            document
                .getElementById(
                    "entryNote"
                )
                .value

    });


    localStorage.setItem(
        "tidpunkt_entries",
        JSON.stringify(
            entries
        )
    );


    closeAddTime();

    renderHome();

    renderReport();

    renderProjects();

}


/* ================= START ================= */

renderHome();

renderReport();

renderProjects();

renderPlanning();

</script>
