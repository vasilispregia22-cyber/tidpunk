<!DOCTYPE html>
<html lang="sv">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>TIDPUNKT</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b1626;
  color: white;
}

.app {
  max-width: 480px;
  margin: auto;
  min-height: 100vh;
  background: #0f1d30;
  padding-bottom: 90px;
}

.header {
  padding: 25px 20px 15px;
}

.logo {
  font-size: 30px;
  font-weight: bold;
  letter-spacing: 4px;
}

.subtitle {
  color: #9aa9bd;
  font-size: 13px;
  margin-top: 5px;
}

.content {
  padding: 15px;
}

.card {
  background: #17263b;
  border-radius: 20px;
  padding: 20px;
  margin-bottom: 15px;
}

.label {
  color: #9aa9bd;
  font-size: 12px;
  margin-bottom: 8px;
}

select {
  width: 100%;
  padding: 15px;
  border-radius: 12px;
  border: none;
  background: #24364e;
  color: white;
  font-size: 16px;
}

.timer {
  text-align: center;
  font-size: 44px;
  font-weight: bold;
  margin: 20px 0 5px;
}

.status {
  text-align: center;
  color: #9aa9bd;
  margin-bottom: 20px;
}

button {
  width: 100%;
  border: none;
  border-radius: 13px;
  padding: 16px;
  font-size: 16px;
  font-weight: bold;
  margin-top: 10px;
}

.start {
  background: #22c55e;
  color: white;
}

.pause {
  background: #eab308;
  color: white;
}

.stop {
  background: #ef4444;
  color: white;
}

.secondary {
  background: #24364e;
  color: white;
}

.nav {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 480px;
  background: #101c2d;
  border-top: 1px solid #26374d;
  display: flex;
  justify-content: space-around;
  padding: 10px 5px;
}

.nav button {
  background: none;
  color: #9aa9bd;
  padding: 8px 4px;
  margin: 0;
  font-size: 11px;
}

.nav button.active {
  color: #22c55e;
}

.record {
  border-bottom: 1px solid #293a51;
  padding: 13px 0;
}

.record:last-child {
  border-bottom: none;
}

.profile-row {
  display: flex;
  justify-content: space-between;
  padding: 12px 0;
  border-bottom: 1px solid #293a51;
}

.profile-row:last-child {
  border-bottom: none;
}

.hidden {
  display: none;
}

h2 {
  margin-top: 5px;
}

</style>

</head>

<body>

<div class="header">

<div class="logo">

</div>

</div>

class="hidden">

</div>

<div
id="workplaceName">

</div>

<div
id="timer"
class="timer">

00:00:00

</div>

<div
id="workStatus"
class="status">

Arbetar

</div>

<button
class="pause"
onclick="pauseWork()">

☕ PAUS

onclick="clockOut()">

STÄMPLA UT

</button>

</div>

</div>


<div id="timePage"
class="hidden">

<div class="card">

<h2>Min tid</h2>

<div
id="records">

Inga registrerade arbetspass.

</div>

</div>

</div>


<div id="placesPage"
class="hidden">

<div class="card">

<h2>Mina arbetsplatser</h2>

<div class="profile-row">

<span>

</span>

<span>
✓
</span>

</div>

<div class="profile-row">

<span>

</span>

<span>

</div>

<div class="profile-row">

<span>
Gävle – Trappstädning
</span>

<span>
✓
</span>

</div>

</div>

</div>


<div id="profilePage"
class="hidden">

<div class="card">

<h2>Min profil</h2>

<div class="profile-row">

<span>
Namn
</span>

<strong>
Anställd
</strong>

</div>

<div class="profile-row">

<span>
Roll
</span>

<strong>
Medarbetare
</strong>

</div>

</div>

</div>


</div>


<div class="nav">

<button
class="active"
onclick="showPage('start')">

🏠<br>
Start

</button>

<button
onclick="showPage('time')">

📅<br>
Min tid

</button>

<button
onclick="showPage('places')">

🏢<br>
Arbetsplatser

</button>

<button
onclick="showPage('profile')">

👤<br>
Profil

</button>

</div>

</div>


<script>

let startTime = null;

let timerInterval = null;

let isPaused = false;

let pauseStart = null;

let totalPause = 0;


function clockIn() {

const workplace =
document.getElementById("workplace").value;

startTime = new Date();

totalPause = 0;

isPaused = false;

document.getElementById(
"workplaceName"
).textContent = workplace;

document.getElementById(
"startPage"
).classList.add("hidden");

document.getElementById(
"workingPage"
).classList.remove("hidden");

startTimer();

}


function startTimer() {

clearInterval(timerInterval);

timerInterval = setInterval(function() {

if (!startTime || isPaused) {
return;
}

cons
